# Produção: sistema + banco em containers.
# Configuração vem do --env-file (no servidor: .env.producao, fora do git).
# O banco não publica porta; o sistema escuta só em 127.0.0.1 e o Apache
# cuida do HTTPS.

name: treinamento

x-ambiente-aplicacao: &ambiente-aplicacao
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  AUTH_SECRET: ${AUTH_SECRET}
  URL_BASE: ${URL_BASE}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    image: treinamento-app
    restart: unless-stopped
    environment: *ambiente-aplicacao
    ports:
      - "127.0.0.1:${APP_PORTA:-3150}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Migrações e dados iniciais, sob demanda (usado pelo deploy.sh)
  ferramentas:
    build:
      context: .
      target: ferramentas
    image: treinamento-ferramentas
    profiles: ["ferramentas"]
    environment:
      <<: *ambiente-aplicacao
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NOME: ${SEED_ADMIN_NOME:-}
      SEED_DEMO: ${SEED_DEMO:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
